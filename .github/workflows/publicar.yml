# Publica o Vagas na Cloudflare sem precisar de terminal.
#
# Depois de cadastrar os dois segredos (ver docs/PUBLICAR.md), dá para publicar
# clicando em "Run workflow" na aba Actions do GitHub. Cada push nas pastas do
# app também republica.
name: Publicar o Vagas

on:
  workflow_dispatch:
  push:
    branches:
      - claude/vagas-parking-detection-app-o30hao
      - main

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sem os segredos o trabalho termina em verde com a instrução, em vez de
      # encher o repositório de falhas vermelhas antes de tudo estar pronto.
      - name: Conferir e limpar a credencial
        id: segredos
        env:
          # O segredo desta conta foi cadastrado como CLOUDFARE_API_TOKEN, sem
          # o L. Aceitamos os dois nomes porque o token da Cloudflare so e
          # exibido uma vez: exigir o nome certo custaria refazer o token
          # inteiro, e o fluxo nao fica melhor por isso.
          TOKEN_BRUTO: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          # Apenas os NOMES do que o GitHub entregou a esta execucao. Valor de
          # segredo nunca aparece aqui (o jq abaixo le so as chaves), e e isso
          # que distingue "nome digitado diferente" de "salvo na aba errada".
          NOMES_SEGREDOS: ${{ toJSON(secrets) }}
          NOMES_VARIAVEIS: ${{ toJSON(vars) }}
        run: |
          # A tela de token da Cloudflare, no celular, tem duas armadilhas: ela
          # quebra o token em varias linhas (copiado com o dedo, vem com quebras
          # dentro) e oferece um segundo botao de copiar, o do comando curl de
          # teste — que traz 'Authorization: Bearer <token>' junto. Os dois casos
          # chegam aqui como "formato invalido" sem dizer por que. Normalizamos
          # os dois e validamos o resultado.
          TOKEN=$(printf '%s' "$TOKEN_BRUTO" | tr -d '[:space:]')
          case "$TOKEN" in *Bearer*) TOKEN="${TOKEN##*Bearer}" ;; esac
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '"'"'"'`\\')
          if [ -z "$TOKEN" ]; then
            echo "faltando=sim" >> "$GITHUB_OUTPUT"
            segredos=$(printf '%s' "$NOMES_SEGREDOS" | jq -r 'keys | join(", ")')
            variaveis=$(printf '%s' "$NOMES_VARIAVEIS" | jq -r 'keys | join(", ")')
            {
              echo "### Falta o segredo da Cloudflare"
              echo ""
              echo "O GitHub nao entregou \`CLOUDFLARE_API_TOKEN\` para esta execucao."
              echo ""
              echo "| O que existe | Nomes |"
              echo "|---|---|"
              echo "| Segredos (aba **Secrets**) | \`${segredos:-nenhum}\` |"
              echo "| Variaveis (aba **Variables**) | \`${variaveis:-nenhuma}\` |"
              echo ""
              echo "Se o nome aparecer em **Variables**, ele foi salvo na aba errada:"
              echo "apague de la e recrie em **Secrets** — variavel fica em texto aberto."
              echo ""
              echo "Passo a passo: [docs/PUBLICAR.md](../blob/HEAD/docs/PUBLICAR.md)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "segredos disponiveis: ${segredos:-nenhum}"
            echo "variaveis disponiveis: ${variaveis:-nenhuma}"
          else
            # Mascara o valor limpo: ele difere do segredo registrado, entao o
            # GitHub nao o esconderia sozinho dos logs.
            echo "::add-mask::$TOKEN"

            if ! printf '%s' "$TOKEN" | grep -qE '^[A-Za-z0-9_.~-]{25,200}$'; then
              {
                echo "### O segredo nao parece um token"
                echo ""
                echo "Depois de limpar espacos, aspas e o \`Bearer\`, sobrou algo com"
                echo "**${#TOKEN} caracteres** que nao tem a cara de um token da Cloudflare."
                echo ""
                echo "Refaca o segredo copiando **so o token**, pelo botao de copiar da"
                echo "caixa pontilhada — nao o do comando \`curl\` logo abaixo dela."
                echo ""
                echo "Passo a passo: [docs/PUBLICAR.md](../blob/HEAD/docs/PUBLICAR.md)"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::o segredo tem ${#TOKEN} caracteres e nao parece um token da Cloudflare"
              exit 1
            fi

            echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "faltando=nao" >> "$GITHUB_OUTPUT"
            if [ "$TOKEN" != "$TOKEN_BRUTO" ]; then
              echo "o segredo veio com espacos, aspas ou o comando curl em volta; usei so o token"
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.segredos.outputs.faltando == 'nao'
        with:
          node-version: '22'
          cache: npm

      - name: Instalar
        if: steps.segredos.outputs.faltando == 'nao'
        run: npm ci

      - name: Testar
        if: steps.segredos.outputs.faltando == 'nao'
        run: npm test

      - name: Montar o app
        if: steps.segredos.outputs.faltando == 'nao'
        run: |
          npm run build -w @vagas/core
          npm run assets -w @vagas/worker

      - name: Publicar
        if: steps.segredos.outputs.faltando == 'nao'
        working-directory: services/worker
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee ../../deploy.log

      - name: Endereço do teste
        if: steps.segredos.outputs.faltando == 'nao'
        run: |
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### Publicado"
            echo ""
            echo "O app esta no ar em <${url:-https://vagas.well7025.workers.dev}>"
            echo ""
            echo "É esse o link para mandar no grupo."
          } >> "$GITHUB_STEP_SUMMARY"
